<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Напитки{% endblock %}</title>
    <link href="\static\css\bootstrap.css" rel="stylesheet">
    <script defer src="\static\js\bootstrap.bundle.js"></script>
  <body>
    
    {% block content %}{% endblock %}

    <div class="fixed-bottom">
      <div class="bg-bottom">
        <div class="container text-center p-1">
          <div class="row p-1 me-2">
            
            <div class="col">
              <a href="{% url 'cup_coffee:home' %}" class="btn btn-success rounded-2 me-4">Напитки</a>
            </div>

            {% if user.is_superuser %}
              <div class="col">
                <a href="{% url 'users:list' %}" class="btn btn-success rounded-2 me-4">Все юзеры</a>
              </div>
            {% endif %}

            {% if user.is_authenticated %}
              <div class="col">
                <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
                  {% csrf_token %}
                  <div class="flex-grow-0 ms-2 mt-1">
                    <button type="submit" class="btn btn-success rounded-2">Выйти</button>
                  </div>
                </form>
              </div>
            
            {% else %}
              <div class="col">
                <a href="{% url 'users:login' %}" class="btn btn-success rounded-2 me-4">Вход</a>
              </div>
            {% endif %}

            {% block bottom %}{% endblock %}
          
          </div>        
        </div>
      </div>
    </div>    
  </body>
</html>
