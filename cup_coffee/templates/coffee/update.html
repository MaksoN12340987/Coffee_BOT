{% extends 'coffee/base.html' %}

{% block title %}
  Изменение
{% endblock %}

{% block content %}
  <div class="container-fluid-base text-white">

    <div class="container-md p-3">

      <div class="container-fluid" style="height: 3rem;"></div>

      <div class="container-fluid p-4">
        <h1>Изменение напитков</h1>
      </div>

      <form method="post" class="mb-5" enctype="multipart/form-data">
          
        {% csrf_token %}
        {{ form.as_p }}
          
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="submit" class="btn btn-warning btn-lg mt-3 mb-5 me-5">Сохранить изменения</button>
        </div>
          
      </form>

      <div class="container-fluid text-start" style="height: 6rem;"></div>

    </div>
  </div> 
{% endblock %}


{% block bottom %}
  <div class="container text-center p-1">
    
    <div class="row p-1 me-2">
      <div class="col">
        <a href="{% url 'cup_coffee:home' %}" class="btn btn-success rounded-2 me-4">Напитки</a>
      </div>
    </div>

  </div>
{% endblock %}
