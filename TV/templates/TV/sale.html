<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реклама</title>
  <style>
    /* Сбрасываем все отступы */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Убираем полосы прокрутки */
      background-color: #000; /* Черный фон, если картинка не загрузится */
    }

    /* Если используется поворот экрана как в меню, добавьте его сюда: */
    /* 
    body {
      position: fixed;
      transform: rotate(90deg) translateY(-100vh);
      transform-origin: top left;
      width: 100vh;
      height: 100vw;
    } 
    */

    .fullscreen-ad {
      width: 100vw;
      height: 100vh;
      /* object-fit: cover — заставляет картинку заполнить весь экран, 
         обрезая лишнее по краям, сохраняя пропорции */
      object-fit: cover; 
      /* object-fit: contain — если нужно, чтобы картинка была видна ЦЕЛИКОМ, 
         а пустоты заливались черным/белым фоном */
      display: block;
    }
  </style>
</head>
<body>

  <!-- Замените ссылку на вашу картинку из static или media -->
  <img src="/static/images/sale_10.jpg" alt="Реклама" class="fullscreen-ad">

</body>
</html>
